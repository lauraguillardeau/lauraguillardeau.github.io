<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <style>
        body{
            background-color: #998e8e;
            font-family: 'rubik';
            font-size: 16px;
        }

        .button{
            display: inline-block;
            padding: 10px 20px;
            background-color: #fffdfd;
            color: #000000;
            text-decoration: none;
            border: solid 1px #333;
            border-radius: 30px;
            transition: 0.6s background-color;
        }
        .button:hover{
            background-color: #000000;
            color: #fffdfd;
        }
    </style>
</head>
<body>
    <a class="button" href="#">Demo Button</a>
    <a class="button" href="#">Kabane Café</a>
    <a class="button" href="#">Hot Tabasco</a>
</body>
</html>
